name: Live status refresh

on:
  schedule:
    # 07:00 UTC daily — after the 06:00 production pipeline finalizes.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the LIVE-STATUS table in README.md
        run: python scripts/update_live_status.py

      - name: Commit if changed
        run: |
          git config user.name "live-status-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change — skipping commit"
          else
            git add README.md
            git commit -m "chore: refresh live status (automated)"
            git push
          fi
